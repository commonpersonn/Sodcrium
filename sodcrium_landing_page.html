<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodcrium</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --primary-red: #d30000;
            --primary-blue: #001a99;
            --dark-red: #590000;
            --dark-blue: #000833;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Animasyonlu arka planın kaydırma çubuğu oluşturmasını engeller */
            position: relative;
        }

        /* --- SIVI ARKA PLAN ANİMASYONLARI (LIQUID BACKGROUND) --- */
        .liquid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .blob {
            position: absolute;
            filter: blur(90px);
            border-radius: 50%;
            opacity: 0.8;
            animation: moveBlobs 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: var(--primary-red);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 700px;
            height: 700px;
            background: var(--primary-blue);
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 500px;
            height: 500px;
            background: var(--dark-red);
            top: 40%;
            left: 50%;
            animation-delay: -10s;
        }
        
        .blob-4 {
            width: 400px;
            height: 400px;
            background: #2a0000;
            bottom: 20%;
            left: 10%;
            animation-delay: -7s;
        }

        @keyframes moveBlobs {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
            100% { transform: translate(20px, 20px) scale(1.05); }
        }

        /* --- LIQUID GLASS KART --- */
        .glass-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 4rem;
            text-align: center;
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 600px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            transform: translateY(0);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* --- BAŞLIK (GLOWING TITLE) --- */
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(135deg, #ff4d4d, #4d4dff, #ff0000);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 5s ease infinite;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.4)) drop-shadow(0 0 30px rgba(0, 0, 255, 0.4));
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- BUTONLAR --- */
        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .glass-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* Sıvı parlama efekti */
        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
            transition: all 0.6s ease;
        }

        .glass-btn:hover::before {
            left: 200%;
        }

        .glass-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-highlight);
        }

        /* İndir Butonu Özelleştirmesi (Kırmızı Glow) */
        .btn-download:hover {
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3), inset 0 0 10px rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 77, 77, 0.5);
        }

        /* Discord Butonu Özelleştirmesi (Mavi Glow) */
        .btn-discord:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 255, 0.3), inset 0 0 10px rgba(0, 0, 255, 0.2);
            border-color: rgba(77, 77, 255, 0.5);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Responsive Tasarım */
        @media (max-width: 600px) {
            .glass-container {
                padding: 2.5rem 1.5rem;
            }
            .title {
                font-size: 3rem;
            }
            .btn-group {
                flex-direction: column;
            }
            .glass-btn {
                width: 100%;
            }
        }
    </style>
</head>
